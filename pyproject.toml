[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r2i"
version = "0.1.0"
description = "sqlite ledger + Obsidian vault + Claude Code harness for research projects"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
r2i = "r2i.cli:main"

[tool.setuptools.packages.find]
include = ["r2i*"]

[tool.setuptools.package-data]
r2i = ["entry_source/*.md", "nightly_prompts/*.md", "jobs.default.json", "schema/schema.sql", "schema/migrations/*"]
